services:
  - type: web
    name: ecosupply-logistica-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --graceful-timeout 120
    healthCheckPath: /health
    disk:
      name: painel-dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: AUTO_SYNC
        value: "1"
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_PATH
        value: /var/data/painel.sqlite
      - key: SISGR_TOKEN
        sync: false
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
