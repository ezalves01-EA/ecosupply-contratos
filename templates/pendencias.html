{% extends 'base.html' %}{% block body %}<div class="card"><h3 class="section-title">Contratos / Pendências</h3><table><tr><th>Chave</th><th>Cliente</th><th>Cidade/UF</th><th>Status</th><th>Ações</th></tr>{% for r in rows %}<tr><td>{{r['chave']}}</td><td>{{r['razao_social']}}</td><td>{{r['cidade']}}/{{r['uf']}}</td><td><span class="status status-{{r['status']|lower|replace(' ','-')|replace('ç','c')|replace('ã','a')}}">{{r['status']}}</span></td><td><a class="btn light" href="{{url_for('acesso',id=r['id'])}}">🔒 Ações</a></td></tr>{% endfor %}</table></div>{% endblock %}
