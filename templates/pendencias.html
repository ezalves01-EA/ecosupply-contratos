{% extends 'base.html' %}{% block body %}<div class="card"><h3 class="section-title">Contratos / Pendências</h3><form class="filter-bar" method="get"><div class="filter-field filter-search"><label>Cliente, CNPJ ou chave</label><input name="q" placeholder="Buscar..." value="{{filters.q}}"></div><div class="filter-field"><label>Data inicial (cadastro)</label><input type="date" name="inicio" value="{{filters.inicio}}"></div><div class="filter-field"><label>Data final (cadastro)</label><input type="date" name="fim" value="{{filters.fim}}"></div><div class="filter-field"><label>Mês</label><select name="mes"><option value="">Todos</option>{% for n,m in [(1,'Janeiro'),(2,'Fevereiro'),(3,'Março'),(4,'Abril'),(5,'Maio'),(6,'Junho'),(7,'Julho'),(8,'Agosto'),(9,'Setembro'),(10,'Outubro'),(11,'Novembro'),(12,'Dezembro')] %}<option value="{{n}}" {% if filters.mes==n|string %}selected{% endif %}>{{m}}</option>{% endfor %}</select></div><div class="filter-field"><label>Ano</label><input type="number" name="ano" min="2020" max="2100" placeholder="Todos" value="{{filters.ano}}"></div><div class="filter-field"><label>Status</label><select name="status"><option value="">Todos</option>{% for st in status_opts %}<option value="{{st}}" {% if filters.status==st %}selected{% endif %}>{{st}}</option>{% endfor %}</select></div><div class="filter-field"><label>Filial</label><select name="filial"><option value="">Todas</option>{% if false %}{% for code,label in [('campo_grande','Campo Grande'),('cuiaba','Cuiabá'),('sinop','Sinop')] %}<option value="{{code}}" {% if filters.filial==code %}selected{% endif %}>{{label}}</option>{% endfor %}{% else %}<option value="CAMPO GRANDE" {% if filters.filial=='CAMPO GRANDE' %}selected{% endif %}>Campo Grande</option><option value="CUIABA" {% if filters.filial=='CUIABA' %}selected{% endif %}>Cuiabá</option><option value="SINOP" {% if filters.filial=='SINOP' %}selected{% endif %}>Sinop</option>{% endif %}</select></div><div class="filter-actions"><button class="btn" type="submit">Filtrar</button><a class="btn light" href="{{request.path}}">Limpar</a></div></form><p class="filter-count">{{rows|length}} registro(s) encontrado(s)</p><table><tr><th>Chave</th><th>Cliente</th><th>Cidade/UF</th><th>Status</th><th>Ações</th></tr>{% for r in rows %}<tr><td>{{r['chave']}}</td><td>{{r['razao_social']}}</td><td>{{r['cidade']}}/{{r['uf']}}</td><td><span class="status status-{{r['status']|lower|replace(' ','-')|replace('ç','c')|replace('ã','a')}}">{{r['status']}}</span></td><td><a class="btn light" href="{{url_for('acesso',id=r['id'])}}">🔒 Ações</a></td></tr>{% endfor %}</table></div>{% endblock %}
