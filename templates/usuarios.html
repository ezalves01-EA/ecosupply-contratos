{% extends 'base.html' %}{% block body %}<div class="card"><h2>Usuários</h2><form method="post" class="user-grid"><div><label>Nome</label><input name="nome" required></div><div><label>Usuário</label><input name="usuario" required></div><div><label>Senha inicial</label><input name="senha" type="password" required></div><div><label>Perfil</label><select name="perfil"><option>USUARIO</option><option>ADMIN</option></select></div><div><button class="btn">Criar usuário</button></div></form><hr><table><tr><th>Usuário</th><th>Nome</th><th>Perfil</th><th>Ativo</th></tr>{% for u in rows %}<tr><td>{{u['usuario']}}</td><td>{{u['nome']}}</td><td>{{u['perfil']}}</td><td>{{'SIM' if u['ativo'] else 'NÃO'}}</td></tr>{% endfor %}</table></div>{% endblock %}
